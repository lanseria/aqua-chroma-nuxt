minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true
packages: []

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - unrs-resolver

catalog:
  '@types/file-saver': ^2.0.7
  file-saver: ^2.0.5
  jszip: ^3.10.2

catalogs:
  build:
    '@nuxt/eslint': ^1.17.0
    '@nuxt/kit': ^4.6.3
    '@nuxtjs/color-mode': ^4.1.0
    '@pinia/nuxt': ^1.0.3
    '@types/pg': ^8.23.1
    '@unocss/eslint-config': ^66.12.0
    '@unocss/nuxt': ^66.12.0
    '@vite-pwa/nuxt': ^1.1.1
    '@vueuse/nuxt': ^15.0.0
    nuxt: ^4.6.3
    pg: ^8.23.1
    unocss: ^66.12.0
    unplugin: ^3.7.0
    vite: ^8.3.5
  dev:
    '@antfu/eslint-config': ^10.0.0
    '@types/node': ^26.6.6
    axios: ^1.21.0
    date-fns: ^4.4.0
    echarts: ^6.1.0
    eslint: ^10.14.0
    eslint-plugin-format: ^2.0.1
    nuxt-echarts: ^1.1.0
    typescript: ^5.9.3
    vue-echarts: ^8.3.2
    vue-tsc: ^3.3.14
  frontend:
    '@vueuse/core': ^15.0.0
    pinia: ^4.1.0
    vue: ^3.5.44
  icons:
    '@iconify-json/carbon': ^1.2.29
    '@iconify-json/twemoji': ^1.2.5
minimumReleaseAgeExclude:
  - seroval@1.7.3
